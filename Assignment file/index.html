<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
    <style>
      .control-button {
        position: fixed;
        padding: 14px 26px;
        background-color: #0078D7;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        z-index: 10;
        transition: transform 0.1s ease, background-color 0.3s ease;
      }

      .control-button:active {
        transform: scale(0.95);
      }

      /* Left-side control buttons */
      #anim1-button { bottom: 220px; left: 20px; }
      #pause-button { bottom: 160px; left: 20px; }
      #reset-button { bottom: 100px; left: 20px; }

      /* Right-side camera buttons */
      #top-view-button { bottom: 100px; right: 20px; }
      #front-view-button { bottom: 160px; right: 20px; }
      #rear-view-button { bottom: 220px; right: 20px; }
    </style>
  </head>
  <body>
    <model-viewer id="modelViewer"
      src="2 animation ass file.glb"
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      tone-mapping="neutral" 
      poster="poster.png" 
      shadow-intensity="1"
      animation-name="Object_1.002Action"
      autoplay
      interaction-prompt="none">
      
      <!-- Hotspots -->
      <button class="Hotspot" slot="hotspot-1" data-surface="5 0 41691 41692 41693 0.423 0.476 0.101" data-visibility-attribute="visible">
        <div class="HotspotAnnotation">Display stand</div>
      </button>
      <button class="Hotspot" slot="hotspot-2" data-surface="0 0 25443 25444 25445 0.311 0.481 0.207" data-visibility-attribute="visible">
        <div class="HotspotAnnotation">Lens</div>
      </button>
      <button class="Hotspot" slot="hotspot-3" data-surface="2 0 135 136 137 0.634 0.057 0.309" data-visibility-attribute="visible">
        <div class="HotspotAnnotation">Clip mechanism</div>
      </button>

      <div class="progress-bar hide" slot="progress-bar">
        <div class="update-bar"></div>
      </div>

      <button slot="ar-button" id="ar-button">View in your space</button>
      <div id="ar-prompt">
        <img src="ar_hand_prompt.png">
      </div>
    </model-viewer>  

    <!-- Control Buttons (Left) -->
    <button id="anim1-button" class="control-button">Animation 1</button>
    <button id="pause-button" class="control-button">Pause</button>
    <button id="reset-button" class="control-button">Reset</button>

    <!-- Camera View Buttons (Right) -->
    <button id="top-view-button" class="control-button">Top View</button>
    <button id="front-view-button" class="control-button">Front View</button>
    <button id="rear-view-button" class="control-button">Rear View</button>

    <!-- Scripts -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <script>
      const modelViewer = document.getElementById("modelViewer");

      // Animation Controls
      document.getElementById("anim1-button").addEventListener("click", () => {
        modelViewer.animationName = modelViewer.availableAnimations[0];
        modelViewer.currentTime = 0;
        modelViewer.play();
      });

      document.getElementById("pause-button").addEventListener("click", () => {
        modelViewer.pause();
      });

      document.getElementById("reset-button").addEventListener("click", () => {
        modelViewer.pause();
        modelViewer.currentTime = 0;
      });

      // Camera Transitions
      function setCameraView(azimuth, elevation, radius = '2m') {
        modelViewer.cameraOrbit = `${azimuth} ${elevation} ${radius}`;
        modelViewer.jumpCameraToGoal();
      }

      document.getElementById("top-view-button").addEventListener("click", () => {
        setCameraView('0deg', '90deg');
      });

      document.getElementById("front-view-button").addEventListener("click", () => {
        setCameraView('0deg', '75deg');
      });

      document.getElementById("rear-view-button").addEventListener("click", () => {
        setCameraView('180deg', '75deg');
      });
    </script>
  </body>
</html>
